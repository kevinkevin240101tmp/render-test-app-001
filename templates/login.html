<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>登入</title>
    <style>
        body { background-color: #343541; color: #ececf1; font-family: sans-serif; }
        .container { width: 300px; max-width: 90%; margin: 80px auto; padding: 30px; background-color: #40414f; border-radius: 10px; }
        input { width: 100%; padding: 8px; margin-top: 10px; border-radius: 6px; border: none; box-sizing: border-box; }
        input[type="submit"] { margin-top: 20px; background-color: #19c37d; color: #000; cursor: pointer; }
        .message { margin-top: 10px; color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container">
        <h2>請登入</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="帳號" required>
            <input type="password" name="password" placeholder="密碼" required>
            <input type="submit" value="登入">
        </form>
        {% if message %}
            <div class="message">{{ message }}</div>
        {% endif %}
    </div>
</body>
</html>
